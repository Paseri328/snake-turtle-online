<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 vs 🐢 Online</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at top, #243044 0%, #10141d 45%, #080a0f 100%);
  color: #fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   共通
========================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 24px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel {
  width: min(92vw, 520px);
  padding: 30px;
  border-radius: 24px;
  background: rgba(20, 25, 36, 0.92);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.45),
    inset 0 1px rgba(255,255,255,0.06);
  text-align: center;
}

.title {
  font-size: clamp(42px, 10vw, 76px);
  font-weight: 900;
  letter-spacing: -0.06em;
  margin: 0 0 12px;
}

.subtitle {
  color: #aeb8ca;
  margin-bottom: 28px;
}

.big-button,
.choice-button {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  margin-top: 12px;
  font-weight: 800;
  color: white;
  background: linear-gradient(135deg, #4256ff, #714cff);
  box-shadow: 0 8px 24px rgba(55, 73, 255, 0.28);
  transition: transform .15s, filter .15s;
}

.big-button:hover,
.choice-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.big-button:active,
.choice-button:active {
  transform: translateY(1px);
}

.secondary-button {
  background: rgba(255,255,255,0.08);
  box-shadow: none;
}

.danger-button {
  background: linear-gradient(135deg, #e84c61, #a92745);
}

.choice-button small {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  font-weight: 600;
  opacity: .7;
}

/* =========================
   オンライン画面
========================= */

.online-panel h2,
.first-panel h2 {
  margin-top: 0;
  font-size: 30px;
}

.room-code-display {
  margin: 22px 0;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.06);
}

.room-code {
  display: block;
  margin-top: 8px;
  font-size: 38px;
  font-weight: 900;
  letter-spacing: .12em;
  color: #7ee7ff;
}

.room-input {
  width: 100%;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.25);
  color: white;
  padding: 15px;
  border-radius: 14px;
  text-align: center;
  font-size: 22px;
  letter-spacing: .12em;
  text-transform: uppercase;
  outline: none;
}

.room-input:focus {
  border-color: #7080ff;
  box-shadow: 0 0 0 3px rgba(80,100,255,.15);
}

.status {
  min-height: 24px;
  margin-top: 18px;
  color: #aeb8ca;
}

/* =========================
   ゲーム
========================= */

#gameScreen {
  min-height: 100vh;
  padding: 14px;
}

.game-header {
  width: min(1400px, 100%);
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.game-title {
  font-size: 22px;
  font-weight: 900;
}

.turn-message {
  flex: 1;
  text-align: center;
  font-weight: 800;
  color: #dfe6f5;
}

.room-label {
  font-size: 13px;
  color: #8d98ad;
}

.game-layout {
  width: min(1400px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns:
    minmax(150px, 1fr)
    minmax(440px, 520px)
    minmax(150px, 1fr);
  gap: 18px;
  align-items: center;
}

.player-area {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.player-label {
  width: 100%;
  text-align: center;
  padding: 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  font-weight: 900;
}

.player-label.active {
  box-shadow:
    0 0 0 2px rgba(255,255,255,.2),
    0 0 25px rgba(110,130,255,.35);
}

.player-label img {
  width: min(120px, 45%);
  max-height: 70px;
  object-fit: contain;
  vertical-align: middle;
}

.hand {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 10px;
  min-height: 150px;
  border-radius: 20px;
  background: rgba(0,0,0,.18);
}

.hand-piece {
  position: relative;
  width: 64px;
  height: 64px;
  border: 2px solid transparent;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, border-color .15s;
}

.hand-piece:hover {
  transform: translateY(-4px);
}

.hand-piece.selected {
  border-color: #ffe66d;
  box-shadow: 0 0 18px rgba(255,230,109,.5);
}

.hand-piece.disabled {
  opacity: .35;
  cursor: default;
}

.hand-piece img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.hand-piece[data-size="1"] img {
  width: 50%;
  height: 50%;
}

.hand-piece[data-size="2"] img {
  width: 72%;
  height: 72%;
}

.hand-piece[data-size="3"] img {
  width: 100%;
  height: 100%;
}

/* =========================
   盤面
========================= */

.board-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  position: relative;
}

.board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
  padding: 8px;
  border-radius: 24px;
  background:
    linear-gradient(135deg, #344052, #1d2430);
  box-shadow:
    0 18px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.cell {
  min-width: 0;
  min-height: 0;
  position: relative;
  border-radius: 16px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.025));
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell:hover {
  background:
    linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
}

.board-piece {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  object-fit: contain;
}

.board-piece.size-1 {
  width: 34%;
  height: 34%;
}

.board-piece.size-2 {
  width: 56%;
  height: 56%;
}

.board-piece.size-3 {
  width: 78%;
  height: 78%;
}

.board-piece.gaming {
  animation:
    gamingRainbow .8s linear infinite,
    gamingPulse .42s ease-in-out infinite alternate,
    gamingWiggle .23s ease-in-out infinite alternate;
  z-index: 5;
}

@keyframes gamingRainbow {
  0%   { filter: hue-rotate(0deg) drop-shadow(0 0 5px #fff); }
  50%  { filter: hue-rotate(180deg) drop-shadow(0 0 18px #fff); }
  100% { filter: hue-rotate(360deg) drop-shadow(0 0 5px #fff); }
}

@keyframes gamingPulse {
  from { scale: 1; }
  to   { scale: 1.18; }
}

@keyframes gamingWiggle {
  from { rotate: -4deg; }
  to   { rotate: 4deg; }
}

.board.gaming-board {
  animation:
    boardRainbow 1s linear infinite,
    boardPulse .5s ease-in-out infinite alternate;
}

@keyframes boardRainbow {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(360deg); }
}

@keyframes boardPulse {
  from { box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  to {
    box-shadow:
      0 18px 50px rgba(255,255,255,.2),
      0 0 35px rgba(120,130,255,.5);
  }
}

/* =========================
   持っている駒
========================= */

.holding-area {
  width: min(520px, 100%);
  margin: 14px auto 0;
  min-height: 74px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.held-piece {
  width: 70px;
  height: 70px;
  object-fit: contain;
  animation: heldFloat .7s ease-in-out infinite alternate;
}

@keyframes heldFloat {
  from { transform: translateY(0); }
  to   { transform: translateY(-6px); }
}

/* =========================
   設定
========================= */

.settings-button {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(20,25,36,.9);
  color: white;
  font-size: 22px;
}

.settings-panel {
  position: fixed;
  top: 64px;
  right: 12px;
  width: 280px;
  z-index: 101;
  padding: 20px;
  border-radius: 18px;
  background: rgba(20,25,36,.97);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
}

.settings-panel h3 {
  margin-top: 0;
}

.volume-row {
  margin: 18px 0;
}

.volume-row label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.volume-row input {
  width: 100%;
}

/* =========================
   結果
========================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(3,5,10,.82);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.result-panel {
  width: min(90vw, 440px);
  padding: 32px;
  border-radius: 26px;
  background: rgba(20,25,36,.97);
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}

.result-player {
  width: 150px;
  max-height: 100px;
  object-fit: contain;
}

.result-title {
  font-size: 44px;
  font-weight: 1000;
  margin: 12px 0;
}

/* =========================
   レスポンシブ
========================= */

@media (max-width: 800px) {

  .screen {
    padding: 16px;
  }

  #gameScreen {
    padding: 8px;
  }

  .game-header {
    flex-wrap: wrap;
  }

  .turn-message {
    order: 3;
    flex-basis: 100%;
  }

  .game-layout {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .player-area.snake-area {
    order: 1;
  }

  .board-area {
    order: 2;
    width: min(96vw, 520px);
    margin: auto;
  }

  .player-area.turtle-area {
    order: 3;
  }

  .hand {
    min-height: 86px;
  }

  .hand-piece {
    width: 58px;
    height: 58px;
  }

}
</style>
</head>

<script>
"use strict";


/* =========================================================
   WebSocket設定
========================================================= */

const WS_URL =
  "wss://snake-turtle-online.onrender.com";


/* =========================================================
   DOM
========================================================= */

const startScreen =
  document.getElementById("startScreen");

const onlineScreen =
  document.getElementById("onlineScreen");

const waitingScreen =
  document.getElementById("waitingScreen");

const firstPlayerScreen =
  document.getElementById("firstPlayerScreen");

const gameScreen =
  document.getElementById("gameScreen");

const boardElement =
  document.getElementById("board");

const snakeHandElement =
  document.getElementById("snakeHand");

const turtleHandElement =
  document.getElementById("turtleHand");

const holdingArea =
  document.getElementById("holdingArea");

const turnMessage =
  document.getElementById("turnMessage");

const roomLabel =
  document.getElementById("roomLabel");

const resultOverlay =
  document.getElementById("resultOverlay");

const resultPlayer =
  document.getElementById("resultPlayer");

const resultTitle =
  document.getElementById("resultTitle");

const onlineStatus =
  document.getElementById("onlineStatus");

const roomCodeDisplay =
  document.getElementById("roomCodeDisplay");

const firstPlayerStatus =
  document.getElementById("firstPlayerStatus");


/* =========================================================
   プレイヤー情報
========================================================= */

const PLAYER_NAME = {
  snake: "🐍",
  turtle: "🐢"
};

const PLAYER_IMAGE = {
  snake: "images/snake-player.png",
  turtle: "images/turtle-player.png"
};


/* =========================================================
   駒画像
========================================================= */

const PIECE_IMAGE = {

  snake: {
    1: "images/snake-small.png",
    2: "images/snake-medium.png",
    3: "images/snake-large.png"
  },

  turtle: {
    1: "images/turtle-small.png",
    2: "images/turtle-medium.png",
    3: "images/turtle-large.png"
  }

};


/* =========================================================
   音声
========================================================= */

const AUDIO_FILE = {

  BGM: [
    "sounds/bgm1.mp3",
    "sounds/bgm2.mp3",
    "sounds/bgm3.mp3"
  ],

  SE: {
    start: "sounds/start.mp3",
    pick: "sounds/pick.mp3",
    put: "sounds/put.mp3",
    three: "sounds/three.mp3",
    error: "sounds/error.mp3",
    turn: "sounds/turn.mp3",
    win: "sounds/win.mp3"
  }

};

let bgmVolume = 0.5;
let seVolume = 0.7;

let bgmIndex = 0;
let currentBGM = null;


/* =========================================================
   音声関数
========================================================= */

function playSE(name) {

  const file =
    AUDIO_FILE.SE[name];

  if (!file) {
    return;
  }

  try {

    const audio =
      new Audio(file);

    audio.volume =
      seVolume;

    audio.play().catch(() => {});

  } catch (error) {

    console.warn(error);

  }

}


function playBGM() {

  stopBGM();

  try {

    currentBGM =
      new Audio(
        AUDIO_FILE.BGM[bgmIndex]
      );

    currentBGM.loop =
      true;

    currentBGM.volume =
      bgmVolume;

    currentBGM.play().catch(() => {});

  } catch (error) {

    console.warn(error);

  }

}


function stopBGM() {

  if (!currentBGM) {
    return;
  }

  try {

    currentBGM.pause();

    currentBGM.currentTime =
      0;

  } catch (error) {

    console.warn(error);

  }

  currentBGM = null;

}


function nextBGM() {

  bgmIndex++;

  if (
    bgmIndex >=
    AUDIO_FILE.BGM.length
  ) {

    bgmIndex = 0;

  }

  playBGM();

}


/* =========================================================
   設定
========================================================= */

const settingsButton =
  document.getElementById(
    "settingsButton"
  );

const settingsPanel =
  document.getElementById(
    "settingsPanel"

/* =========================================================
   接続
========================================================= */

function connectSocket() {

  return new Promise(
    (resolve, reject) => {

      if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ) {

        resolve();

        return;

      }


      socket =
        new WebSocket(WS_URL);


      socket.addEventListener(
        "open",
        () => {

          resolve();

        },
        {
          once: true
        }
      );


      socket.addEventListener(
        "error",
        error => {

          reject(error);

        },
        {
          once: true
        }
      );


      socket.addEventListener(
        "message",
        event => {

          handleServerMessage(
            event.data
          );

        }
      );


      socket.addEventListener(
        "close",
        () => {

          if (
            !victorySequenceRunning
          ) {

            showConnectionError(
              "サーバーとの接続が切れました。"
            );

          }

        }
      );

    }
  );

}


function sendMessage(message) {

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    showConnectionError(
      "サーバーに接続されていません。"
    );

    return false;

  }

  socket.send(
    JSON.stringify(message)
  );

  return true;

}

function createCPUGameState(
  firstPlayer
) {

  const board = [
    [[], [], []],
    [[], [], []],
    [[], [], []]
  ];


  const hands = {
    snake: [],
    turtle: []
  };


  let id = 0;


  for (
    const animal of
    ["snake", "turtle"]
  ) {

    for (
      const size of
      [3, 3, 2, 2, 1, 1]
    ) {

      hands[animal].push({

        id:
          `${animal}-${id}`,

        animal:
          animal,

        size:
          size,

        used:
          false

      });


      id++;

    }

  }


  return {

    board:
      board,

    hands:
      hands,

    currentPlayer:
      firstPlayer,

    firstPlayer:
      firstPlayer,

    turnNumber:
      0,

    heldPiece:
      null,

    heldFrom:
      null,

    gameOver:
      false,

    winningCells:
      [],

    phase:
      "playing"

  };

}

/* =========================================================
   CPU対戦
========================================================= */

/*
  勝利しているマスを探す
*/
function findWinningCells(
  state,
  animal
) {

  const visible = [];


  for (
    let y = 0;
    y < 3;
    y++
  ) {

    for (
      let x = 0;
      x < 3;
      x++
    ) {

      const stack =
        state.board[y][x];


      if (
        stack.length === 0
      ) {

        continue;

      }


      const top =
        stack[
          stack.length - 1
        ];


      visible.push({

        x: x,
        y: y,

        animal:
          top.animal

      });

    }

  }


  const lines = [

    [
      { x: 0, y: 0 },
      { x: 1, y: 0 },
      { x: 2, y: 0 }
    ],

    [
      { x: 0, y: 1 },
      { x: 1, y: 1 },
      { x: 2, y: 1 }
    ],

    [
      { x: 0, y: 2 },
      { x: 1, y: 2 },
      { x: 2, y: 2 }
    ],

    [
      { x: 0, y: 0 },
      { x: 0, y: 1 },
      { x: 0, y: 2 }
    ],

    [
      { x: 1, y: 0 },
      { x: 1, y: 1 },
      { x: 1, y: 2 }
    ],

    [
      { x: 2, y: 0 },
      { x: 2, y: 1 },
      { x: 2, y: 2 }
    ],

    [
      { x: 0, y: 0 },
      { x: 1, y: 1 },
      { x: 2, y: 2 }
    ],

    [
      { x: 2, y: 0 },
      { x: 1, y: 1 },
      { x: 0, y: 2 }
    ]

  ];


  for (
    const line of lines
  ) {

    const matched =
      line.every(
        position => {

          const piece =
            visible.find(
              item =>
                item.x ===
                  position.x &&
                item.y ===
                  position.y
            );


          return (
            piece &&
            piece.animal ===
              animal
          );

        }
      );


    if (matched) {

      return line;

    }

  }


  return [];

}


/*
  最初の手の
  中央への大型駒配置禁止
*/
function isFirstMoveCenterLargeForbidden(
  state,
  piece,
  x,
  y
) {

  if (
    x !== 1 ||
    y !== 1
  ) {

    return false;

  }


  if (
    piece.size !== 3
  ) {

    return false;

  }


  if (
    state.turnNumber !== 0
  ) {

    return false;

  }


  return (
    state.currentPlayer ===
    state.firstPlayer
  );

}


/*
  その駒をそのマスに置けるか
*/
function isLegalPlacement(
  state,
  piece,
  x,
  y
) {

  if (
    x < 0 ||
    x > 2 ||
    y < 0 ||
    y > 2
  ) {

    return false;

  }


  if (
    isFirstMoveCenterLargeForbidden(
      state,
      piece,
      x,
      y
    )
  ) {

    return false;

  }


  const stack =
    state.board[y][x];


  if (
    stack.length === 0
  ) {

    return true;

  }


  const top =
    stack[
      stack.length - 1
    ];


  return (
    piece.size >
    top.size
  );

}


/*
  CPU用に合法な手を全部作る
*/
function getCPUMoves() {

  const state =
    serverState;

  const moves = [];


  /*
    手札から置く手
  */

  const cpuHand =
    state.hands.turtle;


  for (
    const piece of cpuHand
  ) {

    if (
      piece.used
    ) {

      continue;

    }


    for (
      let y = 0;
      y < 3;
      y++
    ) {

      for (
        let x = 0;
        x < 3;
        x++
      ) {

        if (
          !isLegalPlacement(
            state,
            piece,
            x,
            y
          )
        ) {

          continue;

        }


        moves.push({

          type:
            "hand",

          pieceId:
            piece.id,

          x: x,

          y: y

        });

      }

    }

  }


  /*
    盤上の駒を持ち上げて
    別の場所へ置く手
  */

  for (
    let fromY = 0;
    fromY < 3;
    fromY++
  ) {

    for (
      let fromX = 0;
      fromX < 3;
      fromX++
    ) {

      const stack =
        state.board[
          fromY
        ][
          fromX
        ];


      if (
        stack.length === 0
      ) {

        continue;

      }


      const piece =
        stack[
          stack.length - 1
        ];


      if (
        piece.animal !==
        "turtle"
      ) {

        continue;

      }


      /*
        持ち上げた結果、
        🐍が3つ揃う場合は
        CPUはその手を選べない
      */

      const testState =
        JSON.parse(
          JSON.stringify(state)
        );


      testState.board[
        fromY
      ][
        fromX
      ].pop();


      const revealedWin =
        findWinningCells(
          testState,
          "snake"
        );


      if (
        revealedWin.length > 0
      ) {

        continue;

      }


      for (
        let toY = 0;
        toY < 3;
        toY++
      ) {

        for (
          let toX = 0;
          toX < 3;
          toX++
        ) {

          /*
            元のマスには戻せない
          */

          if (
            toX === fromX &&
            toY === fromY
          ) {

            continue;

          }


          if (
            !isLegalPlacement(
              state,
              piece,
              toX,
              toY
            )
          ) {

            continue;

          }


          moves.push({

            type:
              "board",

            fromX:
              fromX,

            fromY:
              fromY,

            toX:
              toX,

            toY:
              toY

          });

        }

      }

    }

  }


  return moves;

}


/* =========================================================
   CPU用状態コピー
========================================================= */

function cloneCPUState(
  state
) {

  return JSON.parse(
    JSON.stringify(state)
  );

}


/* =========================================================
   CPU用仮想手実行
========================================================= */

function applyCPUMoveToState(
  state,
  move
) {

  if (
    move.type ===
    "hand"
  ) {

    const piece =
      state.hands.turtle.find(
        item =>
          item.id ===
          move.pieceId
      );


    if (!piece) {

      return;

    }


    piece.used =
      true;


    state.board[
      move.y
    ][
      move.x
    ].push(
      piece
    );


    return;

  }


  /*
    盤上の駒を移動
  */

  const fromStack =
    state.board[
      move.fromY
    ][
      move.fromX
    ];


  if (
    fromStack.length === 0
  ) {

    return;

  }


  const piece =
    fromStack.pop();


  /*
    下の駒が出た時点で
    相手が勝つ場合
  */

  const revealedWin =
    findWinningCells(
      state,
      "snake"
    );


  if (
    revealedWin.length > 0
  ) {

    state.gameOver =
      true;

    return;

  }


  state.board[
    move.toY
  ][
    move.toX
  ].push(
    piece
  );

}


/* =========================================================
   任意プレイヤー用の合法手生成
========================================================= */

function getCPUMovesForState(
  state,
  animal
) {

  const moves = [];


  /*
    手札
  */

  const hand =
    state.hands[animal];


  for (
    const piece of hand
  ) {

    if (
      piece.used
    ) {

      continue;

    }


    for (
      let y = 0;
      y < 3;
      y++
    ) {

      for (
        let x = 0;
        x < 3;
        x++
      ) {

        if (
          !isLegalPlacement(
            state,
            piece,
            x,
            y
          )
        ) {

          continue;

        }


        moves.push({

          type:
            "hand",

          pieceId:
            piece.id,

          x: x,

          y: y

        });

      }

    }

  }


  /*
    盤上の駒
  */

  for (
    let fromY = 0;
    fromY < 3;
    fromY++
  ) {

    for (
      let fromX = 0;
      fromX < 3;
      fromX++
    ) {

      const stack =
        state.board[
          fromY
        ][
          fromX
        ];


      if (
        stack.length === 0
      ) {

        continue;

      }


      const piece =
        stack[
          stack.length - 1
        ];


      if (
        piece.animal !==
        animal
      ) {

        continue;

      }


      /*
        持ち上げたことで
        相手が勝つ手は除外
      */

      const testState =
        cloneCPUState(
          state
        );


      testState.board[
        fromY
      ][
        fromX
      ].pop();


      const opponent =
        animal === "snake"
          ? "turtle"
          : "snake";


      const revealedWin =
        findWinningCells(
          testState,
          opponent
        );


      if (
        revealedWin.length > 0
      ) {

        continue;

      }


      for (
        let toY = 0;
        toY < 3;
        toY++
      ) {

        for (
          let toX = 0;
          toX < 3;
          toX++
        ) {

          if (
            toX === fromX &&
            toY === fromY
          ) {

            continue;

          }


          if (
            !isLegalPlacement(
              state,
              piece,
              toX,
              toY
            )
          ) {

            continue;

          }


          moves.push({

            type:
              "board",

            fromX:
              fromX,

            fromY:
              fromY,

            toX:
              toX,

            toY:
              toY

          });

        }

      }

    }

  }


  return moves;

}


/* =========================================================
   普通CPUの手を選ぶ
========================================================= */

function chooseNormalCPUMove(
  moves
) {

  let bestScore =
    -Infinity;

  let bestMoves = [];


  for (
    const move of moves
  ) {

    const testState =
      cloneCPUState(
        serverState
      );


    applyCPUMoveToState(
      testState,
      move
    );


    let score =
      0;


    /*
      =========================
      ① 自分が勝つ手
      =========================
    */

    const ownWin =
      findWinningCells(
        testState,
        "turtle"
      );


    if (
      ownWin.length > 0
    ) {

      score +=
        100000;

    }


    /*
      =========================
      ② 相手の勝利を防ぐ
      =========================
    */

    const opponentMoves =
      getCPUMovesForState(
        testState,
        "snake"
      );


    let opponentCanWin =
      false;


    for (
      const opponentMove of
      opponentMoves
    ) {

      const opponentTest =
        cloneCPUState(
          testState
        );


      /*
        相手の仮想手を実行する
      */

      if (
        opponentMove.type ===
        "hand"
      ) {

        const opponentPiece =
          opponentTest.hands.snake.find(
            item =>
              item.id ===
              opponentMove.pieceId
          );


        if (
          opponentPiece
        ) {

          opponentPiece.used =
            true;


          opponentTest.board[
            opponentMove.y
          ][
            opponentMove.x
          ].push(
            opponentPiece
          );

        }

      } else {

        const opponentStack =
          opponentTest.board[
            opponentMove.fromY
          ][
            opponentMove.fromX
          ];


        if (
          opponentStack.length === 0
        ) {

          continue;

        }


        const opponentPiece =
          opponentStack.pop();


        const revealedWin =
          findWinningCells(
            opponentTest,
            "turtle"
          );


        if (
          revealedWin.length > 0
        ) {

          continue;

        }


        opponentTest.board[
          opponentMove.toY
        ][
          opponentMove.toX
        ].push(
          opponentPiece
        );

      }


      const opponentWin =
        findWinningCells(
          opponentTest,
          "snake"
        );


      if (
        opponentWin.length > 0
      ) {

        opponentCanWin =
          true;

        break;

      }

    }


    if (
      !opponentCanWin
    ) {

      score +=
        10000;

    } else {

      score -=
        5000;

    }


    /*
      =========================
      ③ 中央を少し優先
      =========================
    */

    const targetX =
      move.type === "hand"
        ? move.x
        : move.toX;


    const targetY =
      move.type === "hand"
        ? move.y
        : move.toY;


    if (
      targetX === 1 &&
      targetY === 1
    ) {

      score +=
        500;

    }


    /*
      =========================
      ④ 大きい駒を少し優先
      =========================
    */

    let pieceSize =
      1;


    if (
      move.type === "hand"
    ) {

      const piece =
        serverState.hands.turtle.find(
          item =>
            item.id ===
            move.pieceId
        );


      if (piece) {

        pieceSize =
          piece.size;

      }

    } else {

      const stack =
        serverState.board[
          move.fromY
        ][
          move.fromX
        ];


      if (
        stack.length > 0
      ) {

        pieceSize =
          stack[
            stack.length - 1
          ].size;

      }

    }


    score +=
      pieceSize * 20;


    /*
      =========================
      同点なら候補に追加
      =========================
    */

    if (
      score > bestScore
    ) {

      bestScore =
        score;

      bestMoves = [
        move
      ];

    } else if (
      score === bestScore
    ) {

      bestMoves.push(
        move
      );

    }

  }


  if (
    bestMoves.length === 0
  ) {

    return moves[
      Math.floor(
        Math.random() *
        moves.length
      )
    ];

  }


  return bestMoves[
    Math.floor(
      Math.random() *
      bestMoves.length
    )
  ];

}


/* =========================================================
   CPUの手を実行
========================================================= */

function cpuTakeTurn() {

  if (
    !serverState ||
    serverState.gameOver ||
    victorySequenceRunning
  ) {

    return;

  }


  if (
    serverState.currentPlayer !==
    "turtle"
  ) {

    return;

  }


  const moves =
    getCPUMoves();


  if (
    moves.length === 0
  ) {

    console.warn(
      "CPUに合法な手がありません。"
    );

    return;

  }


  let move;


  /*
    簡単CPU
  */

  if (
    cpuDifficulty ===
    "easy"
  ) {

    move =
      moves[
        Math.floor(
          Math.random() *
          moves.length
        )
      ];

  }


  /*
    普通CPU
  */

  else {

    move =
      chooseNormalCPUMove(
        moves
      );

  }


  if (
    move.type ===
    "hand"
  ) {

    cpuPlaceFromHand(
      move
    );

  } else {

    cpuMoveBoardPiece(
      move
    );

  }

}


/*
  CPUが手札から置く
*/
function cpuPlaceFromHand(
  move
) {

  const pieces =
    serverState.hands.turtle;


  const piece =
    pieces.find(
      item =>
        item.id ===
        move.pieceId
    );


  if (!piece) {

    return;

  }


  piece.used =
    true;


  serverState.board[
    move.y
  ][
    move.x
  ].push(
    piece
  );


  serverState.currentPlayer =
    "snake";


  serverState.turnNumber++;


  localSelectedHandPieceId =
    null;


  playSE("put");


  const winningCells =
    findWinningCells(
      serverState,
      "turtle"
    );


  if (
    winningCells.length > 0
  ) {

    finishCPUVictory(
      "turtle",
      winningCells
    );

    return;

  }


  renderAll();

  playSE("turn");

}


/*
  CPUが盤上の駒を動かす
*/
function cpuMoveBoardPiece(
  move
) {

  const fromStack =
    serverState.board[
      move.fromY
    ][
      move.fromX
    ];


  if (
    fromStack.length === 0
  ) {

    return;

  }


  const piece =
    fromStack.pop();


  /*
    下の駒が現れた直後に
    🐍が勝った場合
  */

  const revealedWin =
    findWinningCells(
      serverState,
      "snake"
    );


  if (
    revealedWin.length > 0
  ) {

    serverState.gameOver =
      true;

    serverState.winningCells =
      revealedWin;


    victorySequenceRunning =
      true;


    renderAll();


    boardElement.classList.add(
      "gaming-board"
    );


    playSE("three");


    setTimeout(
      () => {

        showResult(
          "snake",
          revealedWin
        );

      },
      2500
    );


    return;

  }


  serverState.board[
    move.toY
  ][
    move.toX
  ].push(
    piece
  );


  serverState.currentPlayer =
    "snake";


  serverState.turnNumber++;


  playSE("pick");


  setTimeout(
    () => {

      playSE("put");

    },
    100
  );


  const winningCells =
    findWinningCells(
      serverState,
      "turtle"
    );


  if (
    winningCells.length > 0
  ) {

    finishCPUVictory(
      "turtle",
      winningCells
    );

    return;

  }


  renderAll();

  playSE("turn");

}


/*
  CPUモードでの
  人間側のクリック処理
*/
function handleCPUModeCellClick(
  x,
  y
) {

  /*
    駒を持っている状態
  */

  if (
    serverState.heldPiece
  ) {

    const piece =
      serverState.heldPiece;


    /*
      元のマスには戻せない
    */

    if (
      serverState.heldFrom &&
      serverState.heldFrom.x === x &&
      serverState.heldFrom.y === y
    ) {

      playSE("error");


      turnMessage.textContent =
        "持ち上げた駒を元のマスに戻すことはできません。";


      return;

    }


    if (
      !isLegalPlacement(
        serverState,
        piece,
        x,
        y
      )
    ) {

      playSE("error");


      turnMessage.textContent =
        "そのマスには置けません。";


      return;

    }


    serverState.board[y][x].push(
      piece
    );


    serverState.heldPiece =
      null;


    serverState.heldFrom =
      null;


    playSE("put");


    const winningCells =
      findWinningCells(
        serverState,
        "snake"
      );


    if (
      winningCells.length > 0
    ) {

      finishCPUVictory(
        "snake",
        winningCells
      );

      return;

    }


    serverState.currentPlayer =
      "turtle";


    serverState.turnNumber++;


    localSelectedHandPieceId =
      null;


    renderAll();

    playSE("turn");


    setTimeout(
      () => {

        cpuTakeTurn();

      },
      700
    );


    return;

  }


  /*
    手札から置く
  */

  if (
    localSelectedHandPieceId !==
    null
  ) {

    const piece =
      serverState.hands.snake.find(
        item =>
          item.id ===
          localSelectedHandPieceId
      );


    if (!piece) {

      localSelectedHandPieceId =
        null;

      renderHands();

      return;

    }


    if (
      !isLegalPlacement(
        serverState,
        piece,
        x,
        y
      )
    ) {

      playSE("error");


      turnMessage.textContent =
        "そのマスには置けません。";


      return;

    }


    piece.used =
      true;


    serverState.board[y][x].push(
      piece
    );


    localSelectedHandPieceId =
      null;


    playSE("put");


    const winningCells =
      findWinningCells(
        serverState,
        "snake"
      );


    if (
      winningCells.length > 0
    ) {

      finishCPUVictory(
        "snake",
        winningCells
      );

      return;

    }


    serverState.currentPlayer =
      "turtle";


    serverState.turnNumber++;


    renderAll();

    playSE("turn");


    setTimeout(
      () => {

        cpuTakeTurn();

      },
      700
    );


    return;

  }


  /*
    盤上の駒を持ち上げる
  */

  const stack =
    serverState.board[y][x];


  if (
    !stack ||
    stack.length === 0
  ) {

    return;

  }


  const top =
    stack[
      stack.length - 1
    ];


  if (
    top.animal !==
    "snake"
  ) {

    playSE("error");


    turnMessage.textContent =
      "自分の駒だけ持ち上げることができます。";


    return;

  }


  /*
    駒を持ち上げる
  */

  const piece =
    stack.pop();


  serverState.heldPiece =
    piece;


  serverState.heldFrom = {
    x: x,
    y: y
  };


  playSE("pick");


  /*
    下から現れた駒による
    即時勝利
  */

  const revealedWin =
    findWinningCells(
      serverState,
      "turtle"
    );


  if (
    revealedWin.length > 0
  ) {

    serverState.gameOver =
      true;

    serverState.winningCells =
      revealedWin;


    finishCPUVictory(
      "turtle",
      revealedWin
    );


    return;

  }


  renderAll();


  turnMessage.textContent =
    "置く場所を選んでください。";

}


/*
  CPU勝利
*/
function finishCPUVictory(
  winner,

) {

  serverState.gameOver =

  serverState.winningCells =

  victorySequenceRunning =

  localSelectedHandPieceId =

  renderAll();


  boardElement.classList.add(
    "gaming-board"
  );


  playSE("three");


  setTimeout(
    () => {

      showResult(

        winningCells
      );

    },

  );

}


/* =========================================================
   サーバーメッセージ
========================================================= */

function handleServerMessage(
  raw
) {

  let message;


  try {

    message =
      JSON.parse(raw);

  } catch {

    return;

  }


  switch (
    message.type
  ) {

    case "room_created":

      handleRoomCreated(
        message
      );

      break;


    case "waiting":

      handleWaiting(
        message
      );

      break;


    case "room_ready":

      handleRoomReady(
        message
      );

      break;


    case "first_player_select":

      handleFirstPlayerSelect(
        message
      );

      break;


    case "game_start":

      handleGameStart(
        message
      );

      break;


    case "state":

      handleState(
        message
      );

      break;


    case "error":

      handleServerError(
        message
      );

      break;


    case "victory":

      handleVictory(
        message
      );

      break;


    case "replay_select":

      handleReplaySelect(
        message
      );

      break;


    case "opponent_left":

      handleOpponentLeft(
        message
      );

      break;

  }

}

========================================================= */

) {

/* =========================================================
   ゲーム開始
========================================================= */

function handleGameStart(
  message
) {

  myAnimal =
    message.player;

  roomCode =
    message.room;

  serverState =
    message.state;


  localSelectedHandPieceId =
    null;

  );

   状態更新
========================================================= */

function handleState(
  message
) {

  serverState =
    message.state;


  /*
    サーバー側でターンが変わった時に
    ローカル選択を解除。
  */

  if (
    serverState.currentPlayer !==
    myAnimal
  ) {

    localSelectedHandPieceId =
      null;

  }


  renderAll();

}

   エラー
========================================================= */

function handleServerError(
  message
) {

  playSE("error");


  if (message.message) {

    if (
      message.message.includes("部屋")
    ) {

      onlineStatus.textContent =
        message.message;

    }


    firstPlayerStatus.textContent =
      message.message;


    turnMessage.textContent =
      message.message;

  }

}

   勝利

) {

    message.state;


  victorySequenceRunning =
    true;


  renderBoard(
    message.cells
  );


  boardElement.classList.add(

  );

  setTimeout(

      );

  );

   再戦
========================================================= */

function handleReplaySelect(
  message
) {

  resultOverlay.classList.add(
    "hidden"
  );


  victorySequenceRunning =
    false;


  localSelectedHandPieceId =
    null;


  if (message.creator) {

    showFirstPlayerScreen();


    firstPlayerStatus.textContent =
      "次のゲームの先攻を選んでください。";


    enableFirstPlayerButtons();

  } else {

    firstPlayerStatus.textContent =

    disableFirstPlayerButtons();

}

/* =========================================================
   描画
========================================================= */

function renderAll() {

  if (!serverState) {
    return;
  }


  renderBoard(
    serverState.winningCells || []
  );


  renderHands();


  renderHolding();


  renderTurn();


  renderPlayerLabels();

}


/* =========================================================
   盤面描画
========================================================= */

function renderBoard(
  winningCells = []
) {

  boardElement.innerHTML =
    "";


  if (
    serverState &&
    serverState.gameOver
  ) {

    boardElement.classList.add(
      "gaming-board"
    );

  } else {

    boardElement.classList.remove(
      "gaming-board"
    );

  }


  for (
    let y = 0;
    y < 3;
    y++
  ) {

    for (
      let x = 0;
      x < 3;
      x++
    ) {

      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "cell";


      cell.dataset.x =
        x;

      cell.dataset.y =
        y;


      cell.addEventListener(
        "click",
        () => {

          handleCellClick(
            x,
            y
          );

        }
      );


      const stack =
        serverState.board[y][x];


      if (
        stack.length > 0
      ) {

        const piece =
          stack[
            stack.length - 1
          ];


        const img =
          document.createElement(
            "img"
          );


        img.className =
          `board-piece size-${piece.size}`;


        img.src =
          PIECE_IMAGE[
            piece.animal
          ][
            piece.size
          ];


        img.alt =
          "";


        if (
          winningCells.some(
            position =>
              position.x === x &&
              position.y === y
          )
        ) {

          img.classList.add(
            "gaming"
          );

        }


        cell.appendChild(
          img
        );

      }


      boardElement.appendChild(
        cell
      );

    }

  }

}


/* =========================================================
   手札
========================================================= */

function renderHands() {

  renderHand(
    "snake",
    snakeHandElement
  );


  renderHand(
    "turtle",
    turtleHandElement
  );

}


function renderHand(
  animal,
  container
) {

  container.innerHTML =
    "";


  const pieces =
    serverState.hands[
      animal
    ];


  for (
    const piece of pieces
  ) {

    if (piece.used) {
      continue;
    }


    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";


    button.className =
      "hand-piece";


    button.dataset.size =
      piece.size;


    if (
      localSelectedHandPieceId ===
      piece.id
    ) {

      button.classList.add(
        "selected"
      );

    }


    if (
      serverState.currentPlayer !==
      myAnimal ||
      myAnimal !== animal ||
      serverState.heldPiece ||
      victorySequenceRunning
    ) {

      button.classList.add(
        "disabled"
      );

    }


    const img =
      document.createElement(
        "img"
      );


    img.src =
      PIECE_IMAGE[
        animal
      ][
        piece.size
      ];


    img.alt =
      "";


    button.appendChild(
      img
    );


    button.addEventListener(
      "click",
      () => {

        if (
          serverState.currentPlayer !==
          myAnimal
        ) {

          return;

        }


        if (
          myAnimal !== animal
        ) {

          return;

        }


        if (
          serverState.heldPiece
        ) {

          return;

        }


        if (
          victorySequenceRunning
        ) {

          return;

        }


        if (
          localSelectedHandPieceId ===
          piece.id
        ) {

          localSelectedHandPieceId =
            null;


          renderHands();


          return;

        }


        localSelectedHandPieceId =
          piece.id;


        playSE("pick");


        renderHands();


        turnMessage.textContent =
          "置く場所を選んでください。";

      }
    );


    container.appendChild(
      button
    );

  }

}

/* =========================================================
   マスクリック
========================================================= */

function handleCellClick(
  x,
  y
) {

  if (
    victorySequenceRunning ||
    !serverState ||
    serverState.gameOver
  ) {

    return;

  }


  if (
    serverState.currentPlayer !==
    myAnimal
  ) {

    playSE("error");

    return;

  }


  /*
    CPU対戦
  */

  if (
    roomCode === null
  ) {

    handleCPUModeCellClick(
      x,
      y
    );

    return;

  }


  /*
    オンライン対戦
  */

  if (
    serverState.heldPiece
  ) {

    sendMessage({
      type: "place_held",
      x: x,
      y: y
    });

    return;

  }


  if (
    localSelectedHandPieceId !==
    null
  ) {

    sendMessage({
      type: "place_hand",
      id:
        localSelectedHandPieceId,
      x: x,
      y: y
    });

    return;

  }


  const stack =
    serverState.board[y][x];


  if (
    !stack ||
    stack.length === 0
  ) {

    return;

  }


  const top =
    stack[
      stack.length - 1
    ];


  if (
    top.animal !==
    myAnimal
  ) {

    playSE("error");


    turnMessage.textContent =
      "自分の駒だけ持ち上げることができます。";


    return;

  }


  sendMessage({
    type: "pick_board",
    x: x,
    y: y
  });

}


/* =========================================================
   結果表示
========================================================= */

function showResult(
  winner
) {

  resultPlayer.src =
    PLAYER_IMAGE[winner];


  resultTitle.textContent =
    `${PLAYER_NAME[winner]} WIN!`;


  resultOverlay.classList.remove(
    "hidden"
  );


  playSE("win");

}


/* =========================================================
   再戦ボタン
========================================================= */

document
  .getElementById("replayButton")
  .addEventListener(
    "click",
    () => {

      /*
        CPU対戦
      */

      if (
        roomCode === null
      ) {

        nextBGM();


        resultOverlay.classList.add(
          "hidden"
        );


        victorySequenceRunning =
          false;


        localSelectedHandPieceId =
          null;


        showFirstPlayerScreen();


        firstPlayerStatus.textContent =
          "次のゲームの先攻を選んでください。";


        hideCPUDifficultyButtons();


        enableFirstPlayerButtons();


        return;

      }


      /*
        オンライン対戦
      */

      if (!socket) {
        return;
      }


      nextBGM();


      sendMessage({
        type: "replay"
      });

    }
  );


/* =========================================================
   キーボード
========================================================= */

document
  .getElementById("roomInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        document
          .getElementById(
            "joinRoomButton"
          )
          .click();

      }

    }
  );


/* =========================================================
   初期状態
========================================================= */

hideAllScreens();

startScreen.classList.remove(
  "hidden"
);

</script>

</body>
</html>
