<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 vs 🐢 Online</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at top, #243044 0%, #10141d 45%, #080a0f 100%);
  color: #fff;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  overflow-x: hidden;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   共通
========================= */

.screen {
  width: 100%;
  min-height: 100vh;
  padding: 24px;
}

.center-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel {
  width: min(92vw, 520px);
  padding: 30px;
  border-radius: 24px;
  background: rgba(20, 25, 36, 0.92);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 20px 60px rgba(0,0,0,0.45),
    inset 0 1px rgba(255,255,255,0.06);
  text-align: center;
}

.title {
  font-size: clamp(42px, 10vw, 76px);
  font-weight: 900;
  letter-spacing: -0.06em;
  margin: 0 0 12px;
}

.subtitle {
  color: #aeb8ca;
  margin-bottom: 28px;
}

.big-button,
.choice-button {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  margin-top: 12px;
  font-weight: 800;
  color: white;
  background: linear-gradient(135deg, #4256ff, #714cff);
  box-shadow: 0 8px 24px rgba(55, 73, 255, 0.28);
  transition: transform .15s, filter .15s;
}

.big-button:hover,
.choice-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.big-button:active,
.choice-button:active {
  transform: translateY(1px);
}

.secondary-button {
  background: rgba(255,255,255,0.08);
  box-shadow: none;
}

.danger-button {
  background: linear-gradient(135deg, #e84c61, #a92745);
}

/* =========================
   オンライン画面
========================= */

.online-panel h2,
.first-panel h2 {
  margin-top: 0;
  font-size: 30px;
}

.room-code-display {
  margin: 22px 0;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255,255,255,0.06);
}

.room-code {
  display: block;
  margin-top: 8px;
  font-size: 38px;
  font-weight: 900;
  letter-spacing: .12em;
  color: #7ee7ff;
}

.room-input {
  width: 100%;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.25);
  color: white;
  padding: 15px;
  border-radius: 14px;
  text-align: center;
  font-size: 22px;
  letter-spacing: .12em;
  text-transform: uppercase;
  outline: none;
}

.room-input:focus {
  border-color: #7080ff;
  box-shadow: 0 0 0 3px rgba(80,100,255,.15);
}

.status {
  min-height: 24px;
  margin-top: 18px;
  color: #aeb8ca;
}

/* =========================
   ゲーム
========================= */

#gameScreen {
  min-height: 100vh;
  padding: 14px;
}

.game-header {
  width: min(1400px, 100%);
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.game-title {
  font-size: 22px;
  font-weight: 900;
}

.turn-message {
  flex: 1;
  text-align: center;
  font-weight: 800;
  color: #dfe6f5;
}

.room-label {
  font-size: 13px;
  color: #8d98ad;
}

.game-layout {
  width: min(1400px, 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns:
    minmax(150px, 1fr)
    minmax(440px, 520px)
    minmax(150px, 1fr);
  gap: 18px;
  align-items: center;
}

.player-area {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.player-label {
  width: 100%;
  text-align: center;
  padding: 10px;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  font-weight: 900;
}

.player-label.active {
  box-shadow:
    0 0 0 2px rgba(255,255,255,.2),
    0 0 25px rgba(110,130,255,.35);
}

.player-label img {
  width: min(120px, 45%);
  max-height: 70px;
  object-fit: contain;
  vertical-align: middle;
}

.hand {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 10px;
  min-height: 150px;
  border-radius: 20px;
  background: rgba(0,0,0,.18);
}

.hand-piece {
  position: relative;
  width: 64px;
  height: 64px;
  border: 2px solid transparent;
  border-radius: 14px;
  background: rgba(255,255,255,.05);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, border-color .15s;
}

.hand-piece:hover {
  transform: translateY(-4px);
}

.hand-piece.selected {
  border-color: #ffe66d;
  box-shadow: 0 0 18px rgba(255,230,109,.5);
}

.hand-piece.disabled {
  opacity: .35;
  cursor: default;
}

.hand-piece img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.hand-piece[data-size="1"] img {
  width: 50%;
  height: 50%;
}

.hand-piece[data-size="2"] img {
  width: 72%;
  height: 72%;
}

.hand-piece[data-size="3"] img {
  width: 100%;
  height: 100%;
}

/* =========================
   盤面
========================= */

.board-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  position: relative;
}

.board {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 8px;
  padding: 8px;
  border-radius: 24px;
  background:
    linear-gradient(135deg, #344052, #1d2430);
  box-shadow:
    0 18px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.08);
}

.cell {
  min-width: 0;
  min-height: 0;
  position: relative;
  border-radius: 16px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.025));
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell:hover {
  background:
    linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
}

.board-piece {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  object-fit: contain;
}

.board-piece.size-1 {
  width: 34%;
  height: 34%;
}

.board-piece.size-2 {
  width: 56%;
  height: 56%;
}

.board-piece.size-3 {
  width: 78%;
  height: 78%;
}

.board-piece.gaming {
  animation:
    gamingRainbow .8s linear infinite,
    gamingPulse .42s ease-in-out infinite alternate,
    gamingWiggle .23s ease-in-out infinite alternate;
  z-index: 5;
}

@keyframes gamingRainbow {
  0%   { filter: hue-rotate(0deg) drop-shadow(0 0 5px #fff); }
  50%  { filter: hue-rotate(180deg) drop-shadow(0 0 18px #fff); }
  100% { filter: hue-rotate(360deg) drop-shadow(0 0 5px #fff); }
}

@keyframes gamingPulse {
  from { scale: 1; }
  to   { scale: 1.18; }
}

@keyframes gamingWiggle {
  from { rotate: -4deg; }
  to   { rotate: 4deg; }
}

.board.gaming-board {
  animation:
    boardRainbow 1s linear infinite,
    boardPulse .5s ease-in-out infinite alternate;
}

@keyframes boardRainbow {
  from { filter: hue-rotate(0deg); }
  to   { filter: hue-rotate(360deg); }
}

@keyframes boardPulse {
  from { box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  to {
    box-shadow:
      0 18px 50px rgba(255,255,255,.2),
      0 0 35px rgba(120,130,255,.5);
  }
}

/* =========================
   持っている駒
========================= */

.holding-area {
  width: min(520px, 100%);
  margin: 14px auto 0;
  min-height: 74px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.held-piece {
  width: 70px;
  height: 70px;
  object-fit: contain;
  animation: heldFloat .7s ease-in-out infinite alternate;
}

@keyframes heldFloat {
  from { transform: translateY(0); }
  to   { transform: translateY(-6px); }
}

/* =========================
   設定
========================= */

.settings-button {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(20,25,36,.9);
  color: white;
  font-size: 22px;
}

.settings-panel {
  position: fixed;
  top: 64px;
  right: 12px;
  width: 280px;
  z-index: 101;
  padding: 20px;
  border-radius: 18px;
  background: rgba(20,25,36,.97);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
}

.settings-panel h3 {
  margin-top: 0;
}

.volume-row {
  margin: 18px 0;
}

.volume-row label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
}

.volume-row input {
  width: 100%;
}

/* =========================
   結果
========================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(3,5,10,.82);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.result-panel {
  width: min(90vw, 440px);
  padding: 32px;
  border-radius: 26px;
  background: rgba(20,25,36,.97);
  text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
}

.result-player {
  width: 150px;
  max-height: 100px;
  object-fit: contain;
}

.result-title {
  font-size: 44px;
  font-weight: 1000;
  margin: 12px 0;
}

/* =========================
   レスポンシブ
========================= */

@media (max-width: 800px) {
  .screen {
    padding: 16px;
  }

  #gameScreen {
    padding: 8px;
  }

  .game-header {
    flex-wrap: wrap;
  }

  .turn-message {
    order: 3;
    flex-basis: 100%;
  }

  .game-layout {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .player-area.snake-area {
    order: 1;
  }

  .board-area {
    order: 2;
    width: min(96vw, 520px);
    margin: auto;
  }

  .player-area.turtle-area {
    order: 3;
  }

  .hand {
    min-height: 86px;
  }

  .hand-piece {
    width: 58px;
    height: 58px;
  }
}
</style>
</head>

<script>
"use strict";

/* =========================================================
   WebSocket設定
========================================================= */

/*
  ローカルテスト:
    ws://localhost:8080

  サーバー公開後:
    wss://あなたのサーバーURL
*/

const WS_URL = "wss://snake-turtle-online.onrender.com";


/* =========================================================
   DOM
========================================================= */

const startScreen =
  document.getElementById("startScreen");

const onlineScreen =
  document.getElementById("onlineScreen");

const waitingScreen =
  document.getElementById("waitingScreen");

const firstPlayerScreen =
  document.getElementById("firstPlayerScreen");

const gameScreen =
  document.getElementById("gameScreen");

const boardElement =
  document.getElementById("board");

const snakeHandElement =
  document.getElementById("snakeHand");

const turtleHandElement =
  document.getElementById("turtleHand");

const holdingArea =
  document.getElementById("holdingArea");

const turnMessage =
  document.getElementById("turnMessage");

const roomLabel =
  document.getElementById("roomLabel");

const resultOverlay =
  document.getElementById("resultOverlay");

const resultPlayer =
  document.getElementById("resultPlayer");

const resultTitle =
  document.getElementById("resultTitle");

const onlineStatus =
  document.getElementById("onlineStatus");

const roomCodeDisplay =
  document.getElementById("roomCodeDisplay");

const firstPlayerStatus =
  document.getElementById("firstPlayerStatus");


/* =========================================================
   プレイヤー情報
========================================================= */

const PLAYER_NAME = {
  snake: "🐍",
  turtle: "🐢"
};

const PLAYER_IMAGE = {
  snake: "images/snake-player.png",
  turtle: "images/turtle-player.png"
};


/* =========================================================
   駒画像
========================================================= */

const PIECE_IMAGE = {
  snake: {
    1: "images/snake-small.png",
    2: "images/snake-medium.png",
    3: "images/snake-large.png"
  },

  turtle: {
    1: "images/turtle-small.png",
    2: "images/turtle-medium.png",
    3: "images/turtle-large.png"
  }
};


/* =========================================================
   音声
========================================================= */

const AUDIO_FILE = {
  BGM: [
    "sounds/bgm1.mp3",
    "sounds/bgm2.mp3",
    "sounds/bgm3.mp3"
  ],

  SE: {
    start: "sounds/start.mp3",
    pick: "sounds/pick.mp3",
    put: "sounds/put.mp3",
    three: "sounds/three.mp3",
    error: "sounds/error.mp3",
    turn: "sounds/turn.mp3",
    win: "sounds/win.mp3"
  }
};

let bgmVolume = 0.5;
let seVolume = 0.7;

let bgmIndex = 0;
let currentBGM = null;


/* =========================================================
   音声関数
========================================================= */

function playSE(name) {
  const file = AUDIO_FILE.SE[name];

  if (!file) return;

  try {
    const audio = new Audio(file);
    audio.volume = seVolume;

    audio.play().catch(() => {});
  } catch (error) {
    console.warn(error);
  }
}

function playBGM() {
  stopBGM();

  try {
    currentBGM =
      new Audio(AUDIO_FILE.BGM[bgmIndex]);

    currentBGM.loop = true;
    currentBGM.volume = bgmVolume;

    currentBGM.play().catch(() => {});
  } catch (error) {
    console.warn(error);
  }
}

function stopBGM() {
  if (!currentBGM) return;

  try {
    currentBGM.pause();
    currentBGM.currentTime = 0;
  } catch (error) {
    console.warn(error);
  }

  currentBGM = null;
}

function nextBGM() {
  bgmIndex++;

  if (bgmIndex >= AUDIO_FILE.BGM.length) {
    bgmIndex = 0;
  }

  playBGM();
}


/* =========================================================
   設定
========================================================= */

const settingsButton =
  document.getElementById("settingsButton");

const settingsPanel =
  document.getElementById("settingsPanel");

const bgmVolumeInput =
  document.getElementById("bgmVolume");

const seVolumeInput =
  document.getElementById("seVolume");

const bgmValue =
  document.getElementById("bgmValue");

const seValue =
  document.getElementById("seValue");

const settingsClose =
  document.getElementById("settingsClose");

settingsButton.addEventListener("click", () => {
  settingsPanel.classList.toggle("hidden");
});

settingsClose.addEventListener("click", () => {
  settingsPanel.classList.add("hidden");
});

bgmVolumeInput.addEventListener("input", () => {
  bgmVolume =
    Number(bgmVolumeInput.value) / 100;

  bgmValue.textContent =
    `${bgmVolumeInput.value}%`;

  if (currentBGM) {
    currentBGM.volume = bgmVolume;
  }
});

seVolumeInput.addEventListener("input", () => {
  seVolume =
    Number(seVolumeInput.value) / 100;

  seValue.textContent =
    `${seVolumeInput.value}%`;
});


/* =========================================================
   WebSocket状態
========================================================= */

let socket = null;

let myAnimal = null;
let roomCode = null;

let isCreator = false;

let serverState = null;

let localSelectedHandPieceId = null;

let victorySequenceRunning = false;


/* =========================================================
   接続
========================================================= */

function connectSocket() {
  return new Promise((resolve, reject) => {

    if (
      socket &&
      socket.readyState === WebSocket.OPEN
    ) {
      resolve();
      return;
    }

    socket = new WebSocket(WS_URL);

    socket.addEventListener("open", () => {
      resolve();
    }, { once: true });

    socket.addEventListener("error", error => {
      reject(error);
    }, { once: true });

    socket.addEventListener("message", event => {
      handleServerMessage(event.data);
    });

    socket.addEventListener("close", () => {
      if (!victorySequenceRunning) {
        showConnectionError(
          "サーバーとの接続が切れました。"
        );
      }
    });
  });
}

function sendMessage(message) {
  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    showConnectionError(
      "サーバーに接続されていません。"
    );

    return false;
  }

  socket.send(JSON.stringify(message));
  return true;
}


/* =========================================================
   画面切り替え
========================================================= */

function hideAllScreens() {
  startScreen.classList.add("hidden");
  onlineScreen.classList.add("hidden");
  waitingScreen.classList.add("hidden");
  firstPlayerScreen.classList.add("hidden");
  gameScreen.classList.add("hidden");
}

function showOnlineScreen() {
  hideAllScreens();
  onlineScreen.classList.remove("hidden");
}

function showWaitingScreen() {
  hideAllScreens();
  waitingScreen.classList.remove("hidden");
}

function showFirstPlayerScreen() {
  hideAllScreens();
  firstPlayerScreen.classList.remove("hidden");
}

function showGameScreen() {
  hideAllScreens();
  gameScreen.classList.remove("hidden");
}

function showConnectionError(message) {
  onlineStatus.textContent = message;
}


/* =========================================================
   スタート
========================================================= */

const modeSelectArea =
  document.getElementById("modeSelectArea");

const onlineModeButton =
  document.getElementById("onlineModeButton");

const cpuModeButton =
  document.getElementById("cpuModeButton");

const localModeButton =
  document.getElementById("localModeButton");


document
  .getElementById("startButton")
  .addEventListener("click", () => {

    playSE("start");

    document
      .getElementById("startButton")
      .classList.add("hidden");

    modeSelectArea.classList.remove("hidden");
  });


/* オンライン対戦 */
onlineModeButton.addEventListener(
  "click",
  () => {

    showOnlineScreen();
  }
);


/* CPU対戦 */
cpuModeButton.addEventListener(
  "click",
  () => {

    alert("CPU対戦はこれから作ります！");
  }
);


/* ローカル対戦 */
localModeButton.addEventListener(
  "click",
  () => {
    alert("ローカル対戦はこれから作ります！");
  }
);

/* =========================================================
   部屋作成
========================================================= */

document
  .getElementById("createRoomButton")
  .addEventListener("click", async () => {

    try {
      onlineStatus.textContent =
        "サーバーに接続しています……";

      await connectSocket();

      isCreator = true;

      sendMessage({
        type: "create"
      });

    } catch (error) {
      console.error(error);

      onlineStatus.textContent =
        "サーバーに接続できませんでした。";
    }
  });


/* =========================================================
   参加欄
========================================================= */

document
  .getElementById("showJoinButton")
  .addEventListener("click", () => {

    document
      .getElementById("joinArea")
      .classList.toggle("hidden");
  });


/* =========================================================
   部屋参加
========================================================= */

document
  .getElementById("joinRoomButton")
  .addEventListener("click", async () => {

    const input =
      document
        .getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if (!input) {
      onlineStatus.textContent =
        "部屋コードを入力してください。";

      playSE("error");
      return;
    }

    try {
      onlineStatus.textContent =
        "サーバーに接続しています……";

      await connectSocket();

      isCreator = false;

      sendMessage({
        type: "join",
        room: input
      });

    } catch (error) {
      console.error(error);

      onlineStatus.textContent =
        "サーバーに接続できませんでした。";
    }
  });


/* =========================================================
   先攻選択
========================================================= */

document
  .getElementById("firstTurtle")
  .addEventListener("click", () => {
    chooseFirstPlayer("turtle");
  });

document
  .getElementById("firstSnake")
  .addEventListener("click", () => {
    chooseFirstPlayer("snake");
  });

document
  .getElementById("firstRandom")
  .addEventListener("click", () => {
    chooseFirstPlayer("random");
  });

function chooseFirstPlayer(choice) {

  if (!isCreator) {
    return;
  }

  firstPlayerStatus.textContent =
    "先攻を決定しています……";

  sendMessage({
    type: "choose_first",
    firstPlayer: choice
  });
}


/* =========================================================
   サーバーメッセージ
========================================================= */

function handleServerMessage(raw) {

  let message;

  try {
    message = JSON.parse(raw);
  } catch {
    return;
  }

  switch (message.type) {

    case "room_created":
      handleRoomCreated(message);
      break;

    case "waiting":
      handleWaiting(message);
      break;

    case "room_ready":
      handleRoomReady(message);
      break;

    case "first_player_select":
      handleFirstPlayerSelect(message);
      break;

    case "game_start":
      handleGameStart(message);
      break;

    case "state":
      handleState(message);
      break;

    case "error":
      handleServerError(message);
      break;

    case "victory":
      handleVictory(message);
      break;

    case "replay_select":
      handleReplaySelect(message);
      break;

    case "opponent_left":
      handleOpponentLeft(message);
      break;
  }
}


/* =========================================================
   部屋作成完了
========================================================= */

function handleRoomCreated(message) {

  roomCode = message.room;
  myAnimal = message.player;

  roomCodeDisplay.textContent =
    roomCode;

  showWaitingScreen();
}


/* =========================================================
   待機
========================================================= */

function handleWaiting(message) {

  showWaitingScreen();

  if (message.message) {
    document
      .querySelector("#waitingScreen .status")
      .textContent = message.message;
  }
}


/* =========================================================
   相手参加
========================================================= */

function handleRoomReady(message) {

  roomCode = message.room;

  if (message.creator) {
    showFirstPlayerScreen();

    firstPlayerStatus.textContent =
      "先攻を選んでください。";
  }
}


/* =========================================================
   先攻選択要求
========================================================= */

function handleFirstPlayerSelect(message) {

  if (message.creator) {
    showFirstPlayerScreen();

    firstPlayerStatus.textContent =
      "先攻を選んでください。";
  } else {
    showFirstPlayerScreen();

    firstPlayerStatus.textContent =
      "相手が先攻を選んでいます……";

    document
      .getElementById("firstTurtle")
      .disabled = true;

    document
      .getElementById("firstSnake")
      .disabled = true;

    document
      .getElementById("firstRandom")
      .disabled = true;
  }
}


/* =========================================================
   ゲーム開始
========================================================= */

function handleGameStart(message) {

  myAnimal = message.player;
  roomCode = message.room;

  serverState = message.state;

  localSelectedHandPieceId = null;

  resultOverlay.classList.add("hidden");

  victorySequenceRunning = false;

  showGameScreen();

  playSE("start");
  playBGM();

  renderAll();
}


/* =========================================================
   状態更新
========================================================= */

function handleState(message) {

  serverState = message.state;

  /*
    サーバー側でターンが変わった時に
    ローカル選択を解除。
  */
  if (
    serverState.currentPlayer !== myAnimal
  ) {
    localSelectedHandPieceId = null;
  }

  renderAll();
}


/* =========================================================
   エラー
========================================================= */

function handleServerError(message) {

  playSE("error");

  if (message.message) {

    if (
      message.message.includes("部屋")
    ) {
      onlineStatus.textContent =
        message.message;
    }

    firstPlayerStatus.textContent =
      message.message;

    turnMessage.textContent =
      message.message;
  }
}


/* =========================================================
   勝利
========================================================= */

function handleVictory(message) {

  serverState = message.state;

  victorySequenceRunning = true;

  renderBoard(message.cells);

  boardElement.classList.add(
    "gaming-board"
  );

  playSE("three");

  setTimeout(() => {

    showResult(
      message.winner,
      message.cells
    );

  }, 2500);
}


/* =========================================================
   再戦
========================================================= */

function handleReplaySelect(message) {

  resultOverlay.classList.add("hidden");

  victorySequenceRunning = false;

  localSelectedHandPieceId = null;

  if (message.creator) {

    showFirstPlayerScreen();

    firstPlayerStatus.textContent =
      "次のゲームの先攻を選んでください。";

    enableFirstPlayerButtons();

  } else {

    showFirstPlayerScreen();

    firstPlayerStatus.textContent =
      "相手が次のゲームの先攻を選んでいます……";

    disableFirstPlayerButtons();
  }
}


/* =========================================================
   相手退出
========================================================= */

function handleOpponentLeft(message) {

  stopBGM();

  hideAllScreens();

  onlineScreen.classList.remove("hidden");

  onlineStatus.textContent =
    "相手が退出しました。";

  playSE("error");
}


/* =========================================================
   先攻ボタン
========================================================= */

function disableFirstPlayerButtons() {

  document
    .getElementById("firstTurtle")
    .disabled = true;

  document
    .getElementById("firstSnake")
    .disabled = true;

  document
    .getElementById("firstRandom")
    .disabled = true;
}

function enableFirstPlayerButtons() {

  document
    .getElementById("firstTurtle")
    .disabled = false;

  document
    .getElementById("firstSnake")
    .disabled = false;

  document
    .getElementById("firstRandom")
    .disabled = false;
}


/* =========================================================
   描画
========================================================= */

function renderAll() {

  if (!serverState) return;

  renderBoard(serverState.winningCells || []);

  renderHands();

  renderHolding();

  renderTurn();

  renderPlayerLabels();
}


/* =========================================================
   盤面描画
========================================================= */

function renderBoard(winningCells = []) {

  boardElement.innerHTML = "";

  if (
    serverState &&
    serverState.gameOver
  ) {
    boardElement.classList.add(
      "gaming-board"
    );
  } else {
    boardElement.classList.remove(
      "gaming-board"
    );
  }

  for (let y = 0; y < 3; y++) {

    for (let x = 0; x < 3; x++) {

      const cell =
        document.createElement("div");

      cell.className = "cell";

      cell.dataset.x = x;
      cell.dataset.y = y;

      cell.addEventListener(
        "click",
        () => {
          handleCellClick(x, y);
        }
      );

      const stack =
        serverState.board[y][x];

      if (stack.length > 0) {

        const piece =
          stack[stack.length - 1];

        const img =
          document.createElement("img");

        img.className =
          `board-piece size-${piece.size}`;

        img.src =
          PIECE_IMAGE[
            piece.animal
          ][piece.size];

        img.alt = "";

        if (
          winningCells.some(
            position =>
              position.x === x &&
              position.y === y
          )
        ) {
          img.classList.add("gaming");
        }

        cell.appendChild(img);
      }

      boardElement.appendChild(cell);
    }
  }
}


/* =========================================================
   手札
========================================================= */

function renderHands() {

  renderHand(
    "snake",
    snakeHandElement
  );

  renderHand(
    "turtle",
    turtleHandElement
  );
}

function renderHand(
  animal,
  container
) {

  container.innerHTML = "";

  const pieces =
    serverState.hands[animal];

  for (const piece of pieces) {

    if (piece.used) {
      continue;
    }

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "hand-piece";

    button.dataset.size =
      piece.size;

    if (
      localSelectedHandPieceId ===
      piece.id
    ) {
      button.classList.add("selected");
    }

    if (
      serverState.currentPlayer !==
      myAnimal ||
      myAnimal !== animal ||
      serverState.heldPiece ||
      victorySequenceRunning
    ) {
      button.classList.add("disabled");
    }

    const img =
      document.createElement("img");

    img.src =
      PIECE_IMAGE[
        animal
      ][piece.size];

    img.alt = "";

    button.appendChild(img);

    button.addEventListener(
      "click",
      () => {

        if (
          serverState.currentPlayer !==
          myAnimal
        ) {
          return;
        }

        if (myAnimal !== animal) {
          return;
        }

        if (serverState.heldPiece) {
          return;
        }

        if (victorySequenceRunning) {
          return;
        }

        if (
          localSelectedHandPieceId ===
          piece.id
        ) {

          localSelectedHandPieceId =
            null;

          renderHands();

          return;
        }

        localSelectedHandPieceId =
          piece.id;

        playSE("pick");

        renderHands();

        turnMessage.textContent =
          "置く場所を選んでください。";
      }
    );

    container.appendChild(button);
  }
}


/* =========================================================
   持っている駒
========================================================= */

function renderHolding() {

  holdingArea.innerHTML = "";

  if (
    !serverState ||
    !serverState.heldPiece
  ) {
    return;
  }

  const piece =
    serverState.heldPiece;

  const img =
    document.createElement("img");

  img.className =
    "held-piece";

  img.src =
    PIECE_IMAGE[
      piece.animal
    ][piece.size];

  img.alt = "";

  holdingArea.appendChild(img);
}


/* =========================================================
   手番表示
========================================================= */

function renderTurn() {

  if (
    !serverState ||
    !serverState.currentPlayer
  ) {
    turnMessage.textContent = "";
    return;
  }

  if (serverState.gameOver) {
    return;
  }

  if (
    serverState.currentPlayer ===
    myAnimal
  ) {

    turnMessage.textContent =
      `${PLAYER_NAME[myAnimal]} あなたの番です`;

  } else {

    turnMessage.textContent =
      `${PLAYER_NAME[serverState.currentPlayer]} 相手の番です`;
  }
}


/* =========================================================
   プレイヤー表示
========================================================= */

function renderPlayerLabels() {

  const snakeLabel =
    document.getElementById(
      "snakeLabel"
    );

  const turtleLabel =
    document.getElementById(
      "turtleLabel"
    );

  snakeLabel.classList.toggle(
    "active",
    serverState.currentPlayer === "snake"
  );

  turtleLabel.classList.toggle(
    "active",
    serverState.currentPlayer === "turtle"
  );

  snakeLabel.innerHTML = `
    <img
      src="${PLAYER_IMAGE.snake}"
      alt=""
    >
  `;

  turtleLabel.innerHTML = `
    <img
      src="${PLAYER_IMAGE.turtle}"
      alt=""
    >
  `;
}


/* =========================================================
   マスクリック
========================================================= */

function handleCellClick(x, y) {

  if (
    victorySequenceRunning ||
    !serverState ||
    serverState.gameOver
  ) {
    return;
  }

  if (
    serverState.currentPlayer !==
    myAnimal
  ) {
    playSE("error");
    return;
  }

  /*
    すでに駒を持っている場合
  */
  if (serverState.heldPiece) {

    sendMessage({
      type: "place_held",
      x,
      y
    });

    return;
  }

  /*
    手札から選択中
  */
  if (localSelectedHandPieceId !== null) {

    sendMessage({
      type: "place_hand",
      id: localSelectedHandPieceId,
      x,
      y
    });

    return;
  }

  /*
    何も選択していない場合、
    盤上の自分の一番上の駒を持ち上げる。
  */

  const stack =
    serverState.board[y][x];

  if (!stack || stack.length === 0) {
    return;
  }

  const top =
    stack[stack.length - 1];

  if (
    top.animal !== myAnimal
  ) {

    playSE("error");

    turnMessage.textContent =
      "自分の駒だけ持ち上げることができます。";

    return;
  }

  sendMessage({
    type: "pick_board",
    x,
    y
  });
}


/* =========================================================
   結果表示
========================================================= */

function showResult(winner) {

  resultPlayer.src =
    PLAYER_IMAGE[winner];

  resultTitle.textContent =
    `${PLAYER_NAME[winner]} WIN!`;

  resultOverlay.classList.remove(
    "hidden"
  );

  playSE("win");
}


/* =========================================================
   再戦ボタン
========================================================= */

document
  .getElementById("replayButton")
  .addEventListener("click", () => {

    if (!socket) return;

    nextBGM();

    sendMessage({
      type: "replay"
    });
  });


/* =========================================================
   キーボード
========================================================= */

document
  .getElementById("roomInput")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        document
          .getElementById("joinRoomButton")
          .click();
      }
    }
  );


/* =========================================================
   初期状態
========================================================= */

hideAllScreens();

startScreen.classList.remove(
  "hidden"
);
</script>
